[package]
name = "iced_charts"
version = "0.1.0"
edition = "2024"
authors = ["Charles Ray <ray.iced.projects@gmail.com>"]
description = "A charting program using Iced."

[dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master", features=["debug", "advanced", "canvas", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
sha2 = "0.10"
regex = "1.10"
serde_json = "1.0.154"
once_cell = "1.21.4"
csv = "1.3"

[dev-dependencies]
iced_menu = { git = "https://github.com/ray-iced-projects/iced_menu.git" }
rfd = "0.17.2"

[target.'cfg(target_os = "windows")'.dev-dependencies]
native-dialog = { version = "0.9.7", features = [
    "async",
    "windows_dpi_awareness",
    "windows_visual_styles",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
native-dialog = { version = "0.9.7", features = ["async"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
native-dialog = { version = "0.9.7", features = ["async"] }

